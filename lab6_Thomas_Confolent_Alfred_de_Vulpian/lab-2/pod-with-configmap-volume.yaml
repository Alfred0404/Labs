apiVersion: v1
kind: Pod
metadata:
  name: spark-config-reader
  namespace: lab-configmap-secret
spec:
  containers:
    - name: app
      image: busybox:1.37
      command: ["sleep", "600"]
      volumeMounts:
        - name: config-volume
          mountPath: /etc/config
  volumes:
    - name: config-volume
      configMap:
        name: data-platform-config
        items:
          - key: application.yaml
            path: application.yaml
          - key: table_mappings.csv
            path: tables.csv
