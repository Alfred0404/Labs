apiVersion: v1
kind: Pod
metadata:
  name: spark-app
  namespace: lab-configmap-secret
spec:
  containers:
    - name: app
      image: busybox:1.37
      command: ["sleep", "600"]
      env:
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: data-platform-config
              key: log_level
        - name: SPARK_WORKERS
          valueFrom:
            configMapKeyRef:
              name: data-platform-config
              key: spark_workers
      envFrom:
        - configMapRef:
            name: data-platform-config
