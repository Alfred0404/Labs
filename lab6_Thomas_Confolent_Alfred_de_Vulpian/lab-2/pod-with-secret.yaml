apiVersion: v1
kind: Pod
metadata:
  name: ceph-connector
  namespace: lab-configmap-secret
spec:
  containers:
    - name: ceph-app
      image: busybox:1.37
      # For the lab only, we print the example access key.
      command: ["sh", "-c", "echo \"Access Key: $S3_ACCESS_KEY\""]
      env:
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: ceph-s3-credentials
              key: access-key
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: ceph-s3-credentials
              key: secret-key
        - name: S3_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: ceph-s3-credentials
              key: endpoint
      envFrom:
        - secretRef:
            name: ceph-s3-credentials
  restartPolicy: Never
